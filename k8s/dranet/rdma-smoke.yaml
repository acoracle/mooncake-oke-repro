apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: rdma-smoke-a
  namespace: rdma-workloads
spec:
  devices:
    requests:
      - name: rdma
        exactly:
          deviceClassName: dra.net
          selectors:
            - cel:
                expression: device.driver == "dra.net" && has(device.attributes["dra.net"].ifName) && device.attributes["dra.net"].ifName == "ens800f0np0" && device.attributes["dra.net"].rdma == true && has(device.attributes["dra.net"].ipv4)
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: rdma-smoke-b
  namespace: rdma-workloads
spec:
  devices:
    requests:
      - name: rdma
        exactly:
          deviceClassName: dra.net
          selectors:
            - cel:
                expression: device.driver == "dra.net" && has(device.attributes["dra.net"].ifName) && device.attributes["dra.net"].ifName == "ens800f0np0" && device.attributes["dra.net"].rdma == true && has(device.attributes["dra.net"].ipv4)
---
apiVersion: v1
kind: Pod
metadata:
  name: rdma-smoke-a
  namespace: rdma-workloads
  labels:
    app: rdma-smoke
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    oci-rdma: "true"
    oke-rdma-mode: dranet
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: rdma-smoke
          topologyKey: kubernetes.io/hostname
  resourceClaims:
    - name: rdma
      resourceClaimName: rdma-smoke-a
  containers:
    - name: tools
      image: REPLACE_RDMA_TOOLS_IMAGE
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["IPC_LOCK"]
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
        claims:
          - name: rdma
---
